[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nutalert"
version = "2.0.0"
description = "nutalert ups monitoring and alert system"
authors = [
    {name = "Rasool Fatemi", email = "rmfatemi@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyyaml>=6.0",
    "apprise>=1.13.1",
    "paho-mqtt>=2.0.0",
    "plotly>=7.0.0",
    "nicegui>=3.16.0",
    "pydantic>=2.13.5",
    "ruamel-yaml>=0.19.1,<0.20.0",
]

[project.scripts]
nutalert = "nutalert.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pre-commit>=4.2.0",
    "deptry>=0.23.0",
]

[tool.black]
target-version = ["py311"]
preview = true
line-length = 120

[tool.ruff]
target-version = "py311"
line-length = 120
include = [
    "nutalert/**/*.py",
    "*.py"
]
