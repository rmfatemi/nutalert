# NutAlert Configuration
# ======================
# UPS devices are auto-discovered from your NUT server.
# Edit values below and save to apply changes.
config_version: 2  # Do not modify - used for migration
nut_server:
  host: docker.home  # NUT server hostname or IP
  port: 3493 # NUT server port
  check_interval: 15 # Polling interval in seconds
notifications:
  enabled: true  # Enable/disable all notifications
  cooldown: 60 # Minimum seconds between repeated alerts
  urls: |  # Apprise URLs, one per line - https://github.com/caronc/apprise
    tgram://YOUR_BOT_TOKEN/112633525
    gotify://10.0.10.220/AHWK8KSDA-pwpi4
ups_devices:
  ups:
    alert_mode: formula  # "basic" for thresholds, "formula" for custom logic
    gauge_settings:
      load:
        warn_threshold: 80  # Yellow above this %
        high_threshold: 100 # Red above this %
      charge_remaining:
        warn_threshold: 35  # Yellow below this %
        high_threshold: 15 # Red below this %
      runtime:
        warn_threshold: 15  # Yellow below this (minutes)
        high_threshold: 5 # Red below this (minutes)
      voltage:
        nominal: 120  # Expected voltage (230 for EU)
        warn_deviation: 10 # % deviation for yellow
        high_deviation: 15 # % deviation for red
    basic_alerts:
      battery_charge:
        enabled: true
        min: 90
        message: battery charge below minimum threshold
      runtime:
        enabled: true
        min: 15
        message: runtime below minimum threshold
      load:
        enabled: true
        max: 50
        message: ups load exceeds maximum threshold
      input_voltage:
        enabled: false
        min: 110.0
        max: 130.0
        message: input voltage outside acceptable range
      ups_status:
        enabled: true
        acceptable:
        - ol
        - online
        - ol chrg
        alert_when_status_changed: true
        message: "[UPS][🔴 Alert❗]: status not in acceptable list"
    formula_alert:
      expression: (battery_charge < 90 or actual_runtime_minutes < 20) and 
        ups_load < 20  # Variables: ups_load, battery_charge, actual_runtime_minutes, battery_voltage, input_voltage, ups_status
      message: "[UPS][🔴 Alert] load: {ups_load}%, charge: {battery_charge}%, runtime:
        {actual_runtime_minutes:.1f} mins"
