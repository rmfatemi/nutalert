# NutAlert Configuration
# UPS devices are auto-discovered from the NUT server on first run.
# See config.example.yaml for a comprehensive reference with all options.

nut_server:
  host: localhost
  port: 3493
  check_interval: 15

notifications:
  enabled: false
  cooldown: 60
  urls: []
  # Apprise URLs - see https://github.com/caronc/apprise
  # - tgram://bot_token/chat_id
  # - discord://webhook_id/webhook_token
  # - slack://token_a/token_b/token_c

# UPS devices will be auto-populated here after connecting to your NUT server.
# You can then customize thresholds per device.
ups_devices: {}
